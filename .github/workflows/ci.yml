name: Senior checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENIOR_DOMAIN: senior.example.test
      SENIOR_GATEWAY_TOKEN: fixture-gateway-token-01234567890123456789
      SENIOR_WEB_PASSWORD: fixture-password-01234567890123456789
      SENIOR_SESSION_SECRET: fixture-session-secret-01234567890123456789
      SENIOR_TRUST_PROXY: "true"
      SENIOR_TRUSTED_PROXY_HOPS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dokploy Compose
        run: docker compose -f compose.dokploy.yaml config
      - name: Build API image
        run: docker build --target api --tag senior-api:ci .
      - name: Build web image
        run: docker build --target web --tag senior-web:ci .
      - name: Smoke test API image
        run: |
          docker run --detach --name senior-api-ci --env SENIOR_GATEWAY_TOKEN="$SENIOR_GATEWAY_TOKEN" senior-api:ci
          for attempt in $(seq 1 20); do
            if docker exec senior-api-ci node -e "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            if [ "$attempt" -eq 20 ]; then docker logs senior-api-ci; exit 1; fi
            sleep 2
          done
      - name: Smoke test web image
        run: |
          docker run --detach --name senior-web-ci --env SENIOR_GATEWAY_TOKEN --env SENIOR_WEB_PASSWORD --env SENIOR_SESSION_SECRET senior-web:ci
          for attempt in $(seq 1 20); do
            if docker exec senior-web-ci node -e "fetch('http://127.0.0.1:3000/api/auth').then(async r=>{const b=await r.json();process.exit(r.ok&&b.configured?0:1)}).catch(()=>process.exit(1))"; then break; fi
            if [ "$attempt" -eq 20 ]; then docker logs senior-web-ci; exit 1; fi
            sleep 2
          done
      - name: Clean up smoke containers
        if: always()
        run: docker rm --force senior-api-ci senior-web-ci || true
